name: Free Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/free-security-audit.yml'
      - 'source/pyproject.toml'
      - 'source/requirements*.txt'
      - 'source/uv.lock'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/tests/security.test.ts'

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 75
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bootstrap persistent Python 3.13 security runtime
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $pythonVersion = '3.13.15'
          $pythonRoot = "C:\actions-runner\_komi_tools\security-python-$pythonVersion"
          $pythonExe = Join-Path $pythonRoot 'python.exe'

          if (-not (Test-Path $pythonExe)) {
            Remove-Item $pythonRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $pythonRoot -Force | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP "python-$pythonVersion-embed-amd64.zip"
            Invoke-WebRequest -UseBasicParsing -Uri "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip" -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $pythonRoot -Force

            $pth = Join-Path $pythonRoot 'python313._pth'
            $pthText = (Get-Content $pth -Raw) -replace '#import site', 'import site'
            [System.IO.File]::WriteAllText($pth, $pthText, [System.Text.Encoding]::ASCII)

            $getPip = Join-Path $env:RUNNER_TEMP 'get-pip-security.py'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getPip
            & $pythonExe $getPip --disable-pip-version-check
            if ($LASTEXITCODE -ne 0) { throw 'get-pip failed for security Python runtime.' }
          }

          "SECURITY_PYTHON=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $pythonRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $pythonRoot 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $pythonExe --version
          if ($LASTEXITCODE -ne 0) { throw 'Security Python runtime failed to start.' }

      - name: Bootstrap persistent Node.js 24 runtime
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $nodeRoot = 'C:\actions-runner\_komi_tools\node-24-security'
          $nodeExe = Join-Path $nodeRoot 'node.exe'

          if (-not (Test-Path $nodeExe)) {
            Remove-Item $nodeRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $nodeRoot -Force | Out-Null
            $releases = Invoke-RestMethod -UseBasicParsing -Uri 'https://nodejs.org/dist/index.json'
            $release = $releases | Where-Object { $_.version -like 'v24.*' -and $_.lts } | Select-Object -First 1
            if (-not $release) { throw 'Unable to locate a Node.js 24 LTS release.' }
            $version = [string]$release.version
            $archiveName = "node-$version-win-x64.zip"
            $zip = Join-Path $env:RUNNER_TEMP $archiveName
            Invoke-WebRequest -UseBasicParsing -Uri "https://nodejs.org/dist/$version/$archiveName" -OutFile $zip
            $extractRoot = Join-Path $env:RUNNER_TEMP "node-security-$version"
            Remove-Item $extractRoot -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -LiteralPath $zip -DestinationPath $extractRoot -Force
            $inner = Get-ChildItem $extractRoot -Directory | Select-Object -First 1
            if (-not $inner) { throw 'Node.js archive did not contain the expected directory.' }
            Copy-Item -Path (Join-Path $inner.FullName '*') -Destination $nodeRoot -Recurse -Force
          }

          $nodeRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $nodeExe --version
          & (Join-Path $nodeRoot 'npm.cmd') --version
          if ($LASTEXITCODE -ne 0) { throw 'Node.js/npm security runtime failed to start.' }

      - name: Install free security tools
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:SECURITY_PYTHON -m pip install --disable-pip-version-check --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed.' }
          & $env:SECURITY_PYTHON -m pip install --disable-pip-version-check pip-audit bandit ruff detect-secrets cyclonedx-bom
          if ($LASTEXITCODE -ne 0) { throw 'Security tool installation failed.' }

      - name: Audit Python dependencies and source
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path security-reports -Force | Out-Null

          & $env:SECURITY_PYTHON -m pip_audit -r source/requirements-windows-x64.lock.txt --format json --output security-reports/pip-audit.json
          $pipAuditExit = $LASTEXITCODE

          & $env:SECURITY_PYTHON -m bandit -r source -x source/tests -f json -o security-reports/bandit.json
          $banditExit = $LASTEXITCODE

          $ruffOutput = (& ruff check source --output-format json 2>&1 | Out-String)
          $ruffExit = $LASTEXITCODE
          [System.IO.File]::WriteAllText((Join-Path $PWD 'security-reports\ruff.json'), $ruffOutput, (New-Object System.Text.UTF8Encoding($false)))

          $secretOutput = (& detect-secrets scan --all-files --exclude-files '(^|[\\/])(\.git|node_modules|release|dist|build)([\\/]|$)' 2>&1 | Out-String)
          $secretsExit = $LASTEXITCODE
          [System.IO.File]::WriteAllText((Join-Path $PWD 'security-reports\detect-secrets.json'), $secretOutput, (New-Object System.Text.UTF8Encoding($false)))

          try {
            & cyclonedx-py requirements source/requirements-windows-x64.lock.txt --output-reproducible --of JSON -o security-reports/python-sbom.cdx.json
            $sbomExit = $LASTEXITCODE
          }
          catch {
            $sbomExit = 1
            $_.Exception.Message | Out-File -FilePath security-reports/python-sbom-error.txt -Encoding utf8
          }

          @"
          pip_audit_exit=$pipAuditExit
          bandit_exit=$banditExit
          ruff_exit=$ruffExit
          detect_secrets_exit=$secretsExit
          python_sbom_exit=$sbomExit
          "@ | Out-File -FilePath security-reports/python-audit-status.txt -Encoding ascii

          Write-Host "pip-audit exit: $pipAuditExit"
          Write-Host "Bandit exit: $banditExit"
          Write-Host "Ruff exit: $ruffExit"
          Write-Host "detect-secrets exit: $secretsExit"
          Write-Host "Python SBOM exit: $sbomExit"
          Write-Host 'Dependency/static-analysis findings are report-only so an existing finding cannot silently block a release.'

      - name: Audit web dependencies and run security tests
        run: |
          $ErrorActionPreference = 'Stop'
          $npmAuditExit = -1
          $lintExit = -1
          $securityTestExit = -1
          $npmSbomExit = -1

          Push-Location web
          try {
            npm.cmd ci
            if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }

            $npmAudit = (& npm.cmd audit --json 2>&1 | Out-String)
            $npmAuditExit = $LASTEXITCODE
            [System.IO.File]::WriteAllText((Join-Path $PWD '..\security-reports\npm-audit.json'), $npmAudit, (New-Object System.Text.UTF8Encoding($false)))

            $lintOutput = (& npm.cmd run lint 2>&1 | Out-String)
            $lintExit = $LASTEXITCODE
            [System.IO.File]::WriteAllText((Join-Path $PWD '..\security-reports\web-typecheck.txt'), $lintOutput, (New-Object System.Text.UTF8Encoding($false)))

            $securityOutput = (& npm.cmd run test:security 2>&1 | Out-String)
            $securityTestExit = $LASTEXITCODE
            [System.IO.File]::WriteAllText((Join-Path $PWD '..\security-reports\web-security-tests.txt'), $securityOutput, (New-Object System.Text.UTF8Encoding($false)))

            try {
              $npmSbom = (& npm.cmd sbom --sbom-format cyclonedx 2>&1 | Out-String)
              $npmSbomExit = $LASTEXITCODE
              [System.IO.File]::WriteAllText((Join-Path $PWD '..\security-reports\npm-sbom.cdx.json'), $npmSbom, (New-Object System.Text.UTF8Encoding($false)))
            }
            catch {
              $npmSbomExit = 1
              $_.Exception.Message | Out-File -FilePath '..\security-reports\npm-sbom-error.txt' -Encoding utf8
            }
          }
          finally {
            Pop-Location
          }

          @"
          npm_audit_exit=$npmAuditExit
          web_typecheck_exit=$lintExit
          web_security_tests_exit=$securityTestExit
          npm_sbom_exit=$npmSbomExit
          "@ | Out-File -FilePath security-reports/web-audit-status.txt -Encoding ascii

          if ($securityTestExit -ne 0) {
            throw 'Existing web security tests failed. Review security-reports/web-security-tests.txt.'
          }

      - name: Hash audit evidence
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path security-reports)) {
            New-Item -ItemType Directory -Path security-reports -Force | Out-Null
          }
          $lines = foreach ($file in Get-ChildItem security-reports -File | Sort-Object Name) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          if ($null -eq $lines) { $lines = @() }
          $lines | Set-Content -LiteralPath security-reports/REPORT_SHA256SUMS.txt -Encoding ascii

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KOMI-Report-Free-Security-Audit-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: security-reports/
