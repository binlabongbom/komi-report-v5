name: Native Windows x64

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-windows-x64.yml'
      - 'source/**'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows-x64:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Bootstrap persistent MinGit
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $portableRoot = 'C:\actions-runner\_komi_tools\mingit'
          $gitExe = Join-Path $portableRoot 'cmd\git.exe'
          if (-not (Test-Path $gitExe)) {
            New-Item -ItemType Directory -Path $portableRoot -Force | Out-Null
            $release = Invoke-RestMethod -Headers @{ 'User-Agent' = 'KOMI-Report-native-runner' } -Uri 'https://api.github.com/repos/git-for-windows/git/releases/latest'
            $asset = $release.assets | Where-Object { $_.name -match '^MinGit-.*-64-bit\.zip$' } | Select-Object -First 1
            if (-not $asset) { throw 'Unable to locate a 64-bit MinGit asset.' }
            $zip = Join-Path $env:RUNNER_TEMP $asset.name
            Invoke-WebRequest -UseBasicParsing -Uri $asset.browser_download_url -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $portableRoot -Force
          }
          (Join-Path $portableRoot 'cmd') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $gitExe --version
          if ($LASTEXITCODE -ne 0) { throw 'git bootstrap failed.' }

      - name: Runner identity
        run: |
          Write-Host "ComputerName=$env:COMPUTERNAME"
          Write-Host "User=$env:USERNAME"
          Write-Host "Arch=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "Processor=$env:PROCESSOR_IDENTIFIER"
          Write-Host "Cores=$env:NUMBER_OF_PROCESSORS"
          Write-Host "PowerShell=$($PSVersionTable.PSVersion)"
          Write-Host "RunnerOS=$env:RUNNER_OS"
          Write-Host "RunnerArch=$env:RUNNER_ARCH"
          Write-Host "RunnerName=$env:RUNNER_NAME"
          Write-Host "Git=$(git --version)"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap persistent CPython 3.14.7
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $pythonRoot = 'C:\actions-runner\_komi_tools\python-3.14.7'
          $pythonExe = Join-Path $pythonRoot 'python.exe'
          if (-not (Test-Path $pythonExe)) {
            Remove-Item $pythonRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $pythonRoot -Force | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP 'python-3.14.7-embed-amd64.zip'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.14.7/python-3.14.7-embed-amd64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $pythonRoot -Force
            $pth = Join-Path $pythonRoot 'python314._pth'
            $pthText = (Get-Content $pth -Raw) -replace '#import site', 'import site'
            [System.IO.File]::WriteAllText($pth, $pthText, [System.Text.Encoding]::ASCII)
            $getPip = Join-Path $env:RUNNER_TEMP 'get-pip.py'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getPip
            & $pythonExe $getPip --disable-pip-version-check
            if ($LASTEXITCODE -ne 0) { throw 'get-pip failed for Python 3.14.7.' }
          }
          $pythonRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $pythonRoot 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $pythonExe --version
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.14.7 failed to start.' }
          & $pythonExe -m pip install --disable-pip-version-check pytest
          if ($LASTEXITCODE -ne 0) { throw 'pytest install failed.' }

      - name: Verify V5.2.6 source contract
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonExe = 'C:\actions-runner\_komi_tools\python-3.14.7\python.exe'
          & $pythonExe source/tools/version_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'version gate failed on Python 3.14.7.' }
          & $pythonExe -m pytest -q source/tests/test_v526_performance_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'V5.2.6 performance contract tests failed on Python 3.14.7.' }
          git status --short
          git rev-parse HEAD

      - name: Build native Windows x64 application payload
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonExe = 'C:\actions-runner\_komi_tools\python-3.14.7\python.exe'
          $script = Join-Path $env:RUNNER_TEMP 'komi-native-build.py'
          $scriptLines = @(
            'import json',
            'import sys',
            'from pathlib import Path',
            "repo = Path.cwd().resolve()",
            "sys.path.insert(0, str(repo / 'source'))",
            'from tools.build_windows_rc import build_payload',
            "out = (repo / 'release' / 'native-windows-x64').resolve()",
            "payload, evidence = build_payload(out, customer_release=True, build_evidence='windows-x64-native')",
            "result = {'payload': str(payload), 'build_environment': 'windows-x64-native', 'runtime_evidence': evidence}",
            "(out / 'NATIVE_PAYLOAD_BUILD.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')",
            'print(json.dumps(result, ensure_ascii=False))'
          )
          $scriptLines | Set-Content -LiteralPath $script -Encoding utf8
          & $pythonExe $script
          if ($LASTEXITCODE -ne 0) { throw 'native payload build failed.' }

      - name: Smoke test bundled Python 3.14.7 runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Get-Content 'release/native-windows-x64/NATIVE_PAYLOAD_BUILD.json' -Raw | ConvertFrom-Json
          $runtime = Join-Path ([string]$evidence.payload) 'runtime\python.exe'
          if (-not (Test-Path $runtime)) { throw "Bundled runtime not found: $runtime" }
          & $runtime --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Python runtime failed to start.' }
          $smokeCode = "import sys,numpy,cryptography,PyQt6.QtCore,PyQt6.QtWidgets,pydantic_core; print('.'.join(map(str,sys.version_info[:3])))"
          $runtimeVersion = (& $runtime -c $smokeCode).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Bundled dependency smoke test failed.' }
          if ($runtimeVersion -ne '3.14.7') { throw "Expected Python 3.14.7, got $runtimeVersion" }

      - name: Inspect installer capability
        run: |
          $iscc = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($iscc) { Write-Host "ISCC=$iscc" } else { Write-Host 'ISCC=NOT_INSTALLED' }
          Write-Host "InteractiveSession=$env:SESSIONNAME"

      - name: Upload native Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-x64-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            release/native-windows-x64/*.json
            release/native-windows-x64/*.txt
            release/native-windows-x64/*.sha256
