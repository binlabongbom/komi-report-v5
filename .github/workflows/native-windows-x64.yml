name: Native Windows x64

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-windows-x64.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows-x64:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Bootstrap portable Git
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy Bypass -Force
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (-not $git) {
            $portableRoot = Join-Path $env:RUNNER_TEMP 'mingit'
            if (-not (Test-Path (Join-Path $portableRoot 'cmd\git.exe'))) {
              Remove-Item $portableRoot -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Path $portableRoot -Force | Out-Null
              $release = Invoke-RestMethod -Headers @{ 'User-Agent' = 'KOMI-Report-native-runner' } -Uri 'https://api.github.com/repos/git-for-windows/git/releases/latest'
              $asset = $release.assets | Where-Object { $_.name -match '^MinGit-.*-64-bit\.zip$' } | Select-Object -First 1
              if (-not $asset) { throw 'Unable to locate a 64-bit MinGit asset.' }
              $zip = Join-Path $env:RUNNER_TEMP $asset.name
              Invoke-WebRequest -UseBasicParsing -Uri $asset.browser_download_url -OutFile $zip
              Expand-Archive -LiteralPath $zip -DestinationPath $portableRoot -Force
            }
            (Join-Path $portableRoot 'cmd') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Runner identity
        run: |
          Write-Host "ComputerName=$env:COMPUTERNAME"
          Write-Host "User=$env:USERNAME"
          Write-Host "Arch=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "Processor=$env:PROCESSOR_IDENTIFIER"
          Write-Host "Cores=$env:NUMBER_OF_PROCESSORS"
          Write-Host "PowerShell=$($PSVersionTable.PSVersion)"
          Write-Host "RunnerOS=$env:RUNNER_OS"
          Write-Host "RunnerArch=$env:RUNNER_ARCH"
          Write-Host "RunnerName=$env:RUNNER_NAME"
          Write-Host "Git=$(git --version)"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap embeddable Python 3.12
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $pythonRoot = Join-Path $env:RUNNER_TEMP 'komi-python-embed-3.12'
          $pythonExe = Join-Path $pythonRoot 'python.exe'
          if (-not (Test-Path $pythonExe)) {
            Remove-Item $pythonRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $pythonRoot -Force | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP 'python-3.12.10-embed-amd64.zip'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $pythonRoot -Force
            $pth = Join-Path $pythonRoot 'python312._pth'
            $pthText = Get-Content $pth -Raw
            $pthText = $pthText -replace '#import site', 'import site'
            Set-Content -LiteralPath $pth -Value $pthText -Encoding ascii
            $getPip = Join-Path $env:RUNNER_TEMP 'get-pip.py'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getPip
            & $pythonExe $getPip --disable-pip-version-check
          }
          $pythonRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $pythonRoot 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $pythonExe --version
          & $pythonExe -m pip --version

      - name: Verify V5.2.6 source contract
        run: |
          $ErrorActionPreference = 'Stop'
          python source/tools/version_gate.py
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q source/tests/test_v526_performance_contract.py
          git status --short
          git rev-parse HEAD

      - name: Build native Windows x64 application payload
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location source
          @'
          import json
          from pathlib import Path
          from tools.build_windows_rc import build_payload

          output = (Path('..') / 'release' / 'native-windows-x64').resolve()
          payload, evidence = build_payload(
              output,
              customer_release=True,
              build_evidence='windows-x64-native',
          )
          result = {
              'payload': str(payload),
              'build_environment': 'windows-x64-native',
              'runtime_evidence': evidence,
          }
          (output / 'NATIVE_PAYLOAD_BUILD.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(result, ensure_ascii=False))
          '@ | python -
          Pop-Location

      - name: Inspect native payload and installer capability
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = 'release/native-windows-x64/payload'
          if (-not (Test-Path $payload)) { throw 'Native Windows payload was not produced.' }
          Get-ChildItem $payload | Select-Object -First 30 Name, Length
          $iscc = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($iscc) { Write-Host "ISCC=$iscc" } else { Write-Host 'ISCC=NOT_INSTALLED (payload test remains valid)' }
          Write-Host "InteractiveSession=$env:SESSIONNAME"
          Write-Host 'NOTE: service-mode runners can build/test payloads but cannot provide a trustworthy visible-window startup benchmark.'

      - name: Upload native Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-x64-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            release/native-windows-x64/*.json
            release/native-windows-x64/*.txt
            release/native-windows-x64/*.sha256
