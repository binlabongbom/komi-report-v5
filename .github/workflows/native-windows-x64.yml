name: Native Windows x64

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-windows-x64.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows-x64:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Prepare runner policy and tools
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy Bypass -Force
          $gitCandidates = @(
            "$env:ProgramFiles\Git\cmd\git.exe",
            "$env:ProgramFiles\Git\bin\git.exe",
            "$env:ProgramFiles(x86)\Git\cmd\git.exe"
          ) | Where-Object { Test-Path $_ }
          if ($gitCandidates) {
            $gitDir = Split-Path ($gitCandidates | Select-Object -First 1)
            $gitDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "GitPathAdded=$gitDir"
          } else {
            Write-Host 'GitPathAdded=NOT_FOUND'
          }

      - name: Runner identity
        run: |
          Write-Host "ComputerName=$env:COMPUTERNAME"
          Write-Host "User=$env:USERNAME"
          Write-Host "Arch=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "Processor=$env:PROCESSOR_IDENTIFIER"
          Write-Host "Cores=$env:NUMBER_OF_PROCESSORS"
          Write-Host "PowerShell=$($PSVersionTable.PSVersion)"
          Write-Host "RunnerOS=$env:RUNNER_OS"
          Write-Host "RunnerArch=$env:RUNNER_ARCH"
          Write-Host "RunnerName=$env:RUNNER_NAME"
          Write-Host "Workspace=$env:GITHUB_WORKSPACE"
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if ($git) { Write-Host "Git=$(& $git.Source --version)" } else { Write-Host 'Git=NOT_FOUND' }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify V5.2.6 source contract
        run: |
          $ErrorActionPreference = 'Stop'
          python source/tools/version_gate.py
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q source/tests/test_v526_performance_contract.py

      - name: Check native build prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Python=$(python --version 2>&1)"
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if ($git) { Write-Host "Git=$(& $git.Source --version)" } else { throw 'Git for Windows is required on the self-hosted runner.' }
          $isccCommand = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($isccCommand) {
            Write-Host "ISCC=$($isccCommand.Source)"
          } else {
            $candidates = @(
              "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            )
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($found) { Write-Host "ISCC=$found" } else { Write-Host "ISCC=NOT_FOUND" }
          }

      - name: Build native Windows x64 customer candidate
        run: |
          $ErrorActionPreference = 'Stop'
          $isccCommand = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $iscc = if ($isccCommand) { $isccCommand.Source } else { $null }
          if (-not $iscc) {
            $iscc = @(
              "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw 'Inno Setup 6 (ISCC.exe) is required on the self-hosted runner.'
          }
          python source/tools/build_windows_rc.py --customer-release --iscc "$iscc" --output release/native-windows-x64

      - name: Summarize native build
        if: always()
        run: |
          $manifest = 'release/native-windows-x64/WINDOWS_MANIFEST.json'
          if (Test-Path $manifest) {
            $m = Get-Content $manifest -Raw | ConvertFrom-Json
            Write-Host "version=$($m.version)"
            Write-Host "environment=$($m.build_environment)"
            Write-Host "source_commit=$($m.source_commit)"
            Write-Host "artifact_sha256=$($m.artifact_sha256)"
            Write-Host "release_decision=$($m.release_decision)"
            Write-Host "production_go=$($m.production_go)"
          } else {
            Write-Host 'WINDOWS_MANIFEST.json was not produced.'
          }

      - name: Upload native Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-x64-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            release/native-windows-x64/*.json
            release/native-windows-x64/*.txt
            release/native-windows-x64/*.sha256
