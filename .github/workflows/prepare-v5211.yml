name: Prepare and validate V5.2.11 candidate
on:
  push:
    branches: [fix/v5.2.11-registration-errors]
    paths:
      - tools/prepare_v5211.py
      - source/**
      - .github/workflows/prepare-v5211.yml
permissions:
  contents: write
concurrency:
  group: komi-v5211-prepare
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}/source
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      KOMI_PEER_SYNC_STATE_FILE: ${{ runner.temp }}/komi-v5211-peer-state.json
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v5.2.11-registration-errors
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - name: Apply guarded source changes and version gate
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'source/services/build_edition.py')) {
            python tools/prepare_v5211.py
            if ($LASTEXITCODE -ne 0) { throw 'Source preparation failed; no unvalidated patch will be committed' }
          }
          python source/tools/version_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'Version alignment failed' }
          python -m compileall -q source
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax validation failed' }
          git config user.name 'KOMI Candidate Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add source docs packaging/windows/KOMI_Report_V5.iss web/package.json web/package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'fix: apply v5.2.11 registration, peer defaults and offline edition'
            if ($LASTEXITCODE -ne 0) { throw 'Candidate commit failed' }
            git push origin HEAD:fix/v5.2.11-registration-errors
            if ($LASTEXITCODE -ne 0) { throw 'Branch changed concurrently; refusing to overwrite' }
          }
          "SOURCE_COMMIT=$(git rev-parse HEAD)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install locked Windows dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r source/requirements-windows-x64.lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed' }
          python -m pip install --disable-pip-version-check pytest httpx2==2.12.0
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency installation failed' }
      - name: Run candidate and regression tests in isolated processes
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'v5211-evidence'
          New-Item -ItemType Directory -Force $out | Out-Null
          $failed = @()
          foreach ($name in @('test_v5211_hardening','test_peer_sync_authorization','test_secondary_setup','test_v5_2_version_authority','test_offline_license_keys','test_web_service','test_web_api','test_release_builder')) {
            python -m pytest -q ("source/tests/$name.py") ("--junitxml=$out/$name.xml")
            if ($LASTEXITCODE -ne 0) { $failed += $name }
          }
          if ($failed.Count -gt 0) { throw ('Regression failure: ' + ($failed -join ', ')) }
      - name: Export exact source and compact Build Center delta
        run: |
          $ErrorActionPreference = 'Stop'
          python source/tools/build_local_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Reproducible source export failed' }
          $out = Join-Path $env:RUNNER_TEMP 'v5211-evidence'
          $env:KOMI_EVIDENCE = $out
          @'
          import base64, gzip, hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          root = Path.cwd()
          out = Path(os.environ['KOMI_EVIDENCE'])
          archive = root / 'release' / 'KOMI_Report_V5_2_11_Source.zip'
          with zipfile.ZipFile(archive) as z:
              identity_bytes = z.read('SOURCE_ARCHIVE_IDENTITY.json')
              identity = json.loads(identity_bytes)
          assert identity['git_commit'] == os.environ['SOURCE_COMMIT']
          allowed = {row['path'] for row in identity['files']}
          base = 'd08fc0b1841323c2aedc3a86acb145a66fe3f64c'
          changed = subprocess.check_output(['git','diff','--name-only',base,'HEAD'], text=True).splitlines()
          paths = sorted(allowed.intersection(changed))
          patch = subprocess.check_output(['git','diff','--binary','--full-index',base,'HEAD','--',*paths])
          compressed = gzip.compress(patch, mtime=0)
          (out/'source-delta.patch.gz.b64').write_text(base64.b64encode(compressed).decode('ascii'), encoding='ascii')
          (out/'SOURCE_ARCHIVE_IDENTITY.json').write_bytes(identity_bytes)
          (out/'SOURCE_COMMIT.txt').write_text(identity['git_commit']+'\n', encoding='ascii')
          (out/'SOURCE_VALIDATION.json').write_text(json.dumps({'version':'5.2.11','source_commit':identity['git_commit'],'tests_passed':True,'base_commit':base,'base_asset_id':549774280,'base_archive_sha256':'ca07302283dbdc260b33858902a798ab0805f7d59338cad969b0ebb336358805','delta_sha256':hashlib.sha256(patch).hexdigest(),'delta_gzip_sha256':hashlib.sha256(compressed).hexdigest(),'source_archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'production_go':False}, indent=2), encoding='utf-8')
          print('SOURCE_VALIDATED', identity['git_commit'], 'delta_bytes', len(compressed))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Build Center delta export failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KOMI-v5.2.11-source-validation
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/v5211-evidence/*
            release/KOMI_Report_V5_2_11_Source.zip
