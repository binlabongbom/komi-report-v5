name: V5.2.7 Native Build and Runner Install

on:
  push:
    branches: [release/v5.2.7]
    paths: ['.github/workflows/prepare-v527.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-install:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Bootstrap MinGit
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\actions-runner\_komi_tools\mingit'; $git=Join-Path $root 'cmd\git.exe'
          if(-not(Test-Path $git)){throw 'Persistent MinGit missing.'}
          (Join-Path $root 'cmd') | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          & $git --version
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/v5.2.7
      - name: Verify version and user-name regression
        run: |
          $ErrorActionPreference='Stop'
          $py='C:\actions-runner\_komi_tools\python-3.14.7\python.exe'
          & $py source/tools/version_gate.py
          if($LASTEXITCODE -ne 0){throw 'Version gate failed.'}
          & $py -m pytest -q source/tests/test_meter_reader_public_name_enrichment.py
          if($LASTEXITCODE -ne 0){throw 'User-name regression failed.'}
          & $py -m pytest -q source/tests/test_v526_performance_contract.py
          if($LASTEXITCODE -ne 0){throw 'Performance contract failed.'}
      - name: Build native Windows x64 payload
        run: |
          $ErrorActionPreference='Stop'
          $py='C:\actions-runner\_komi_tools\python-3.14.7\python.exe'
          $script=Join-Path $env:RUNNER_TEMP 'komi-v527-build.py'
          @'
          import json,sys
          from pathlib import Path
          repo=Path.cwd().resolve(); sys.path.insert(0,str(repo/'source'))
          from tools.build_windows_rc import build_payload
          out=(repo/'release'/'v5.2.7-native').resolve()
          payload,evidence=build_payload(out,customer_release=True,build_evidence='windows-x64-native')
          info={'payload':str(payload),'runtime_evidence':evidence}
          (out/'NATIVE_PAYLOAD_BUILD.json').write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(info,ensure_ascii=False))
          '@ | Set-Content $script -Encoding utf8
          & $py $script
          if($LASTEXITCODE -ne 0){throw 'Native payload build failed.'}
      - name: Smoke bundled runtime
        run: |
          $ErrorActionPreference='Stop'
          $info=Get-Content 'release/v5.2.7-native/NATIVE_PAYLOAD_BUILD.json' -Raw | ConvertFrom-Json
          $runtime=Join-Path ([string]$info.payload) 'runtime\python.exe'
          $v=(& $runtime -c "import sys,numpy,cryptography,PyQt6.QtCore,PyQt6.QtWidgets,pydantic_core;print('.'.join(map(str,sys.version_info[:3])))").Trim()
          if($LASTEXITCODE -ne 0 -or $v -ne '3.14.7'){throw "Runtime smoke failed: $v"}
      - name: Compile V5.2.7 installer
        run: |
          $ErrorActionPreference='Stop'
          $py='C:\actions-runner\_komi_tools\python-3.14.7\python.exe'
          $iscc=Get-ChildItem 'C:\actions-runner\_komi_tools\inno-7.0.2' -Filter ISCC.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if(-not $iscc){throw 'ISCC.exe missing.'}
          $info=Get-Content 'release/v5.2.7-native/NATIVE_PAYLOAD_BUILD.json' -Raw | ConvertFrom-Json
          $env:KOMI_PAYLOAD=[string]$info.payload; $env:KOMI_ISCC=$iscc; $env:KOMI_COMMIT=(git rev-parse HEAD).Trim()
          $script=Join-Path $env:RUNNER_TEMP 'komi-v527-installer.py'
          @'
          import os,sys
          from pathlib import Path
          repo=Path.cwd().resolve(); sys.path.insert(0,str(repo/'source'))
          from tools.build_windows_rc import compile_installer
          out=(repo/'release'/'v5.2.7-installer').resolve(); out.mkdir(parents=True,exist_ok=True)
          p=compile_installer(payload_root=Path(os.environ['KOMI_PAYLOAD']),output_root=out,source_commit=os.environ['KOMI_COMMIT'],iscc=Path(os.environ['KOMI_ISCC']),customer_release=True)
          print(p)
          '@ | Set-Content $script -Encoding utf8
          & $py $script
          if($LASTEXITCODE -ne 0){throw 'Installer compile failed.'}
          $installer=Get-ChildItem 'release/v5.2.7-installer' -Filter '*.exe' | Select-Object -First 1
          $hash=Get-FileHash -Algorithm SHA256 $installer.FullName
          "$($hash.Hash.ToLowerInvariant())  $($installer.Name)" | Set-Content 'release/v5.2.7-installer/INSTALLER.sha256' -Encoding ascii
          [ordered]@{version='5.2.7';source_commit=$env:KOMI_COMMIT;python_runtime='3.14.7';target='Windows x64';installer=$installer.Name;installer_bytes=$installer.Length;installer_sha256=$hash.Hash.ToLowerInvariant();workflow_run=$env:GITHUB_RUN_ID} | ConvertTo-Json | Set-Content 'release/v5.2.7-installer/RELEASE_INFO.json' -Encoding utf8
      - name: Backup existing database
        run: |
          $ErrorActionPreference='Stop'
          $dataHome=Join-Path $HOME 'KOMI Report V5'; $db=Join-Path $dataHome 'KOMI_Report_V5.db'; $runtimeToml=Join-Path $dataHome 'runtime.toml'
          if(Test-Path $runtimeToml){$m=Select-String $runtimeToml -Pattern '^\s*db_path\s*=\s*["''](.+)["'']\s*$' | Select-Object -First 1;if($m){$c=$m.Matches[0].Groups[1].Value;if(Test-Path $c){$db=$c}}}
          $s=[ordered]@{db_path=$db;db_exists=(Test-Path $db);db_sha256='';backup_path=''}
          if(Test-Path $db){$s.db_sha256=(Get-FileHash -Algorithm SHA256 $db).Hash.ToLowerInvariant();$br=Join-Path $dataHome 'backups\v5.2.7-runner-upgrade';New-Item -ItemType Directory $br -Force|Out-Null;$bp=Join-Path $br ('KOMI_Report_V5_before_5.2.7_'+(Get-Date -Format 'yyyyMMdd_HHmmss')+'.db');Copy-Item $db $bp -Force;$s.backup_path=$bp}
          $s|ConvertTo-Json|Set-Content (Join-Path $env:RUNNER_TEMP 'komi-preinstall-state.json') -Encoding utf8
          $s|ConvertTo-Json
      - name: Silent upgrade on runner
        run: |
          $ErrorActionPreference='Stop'
          $installer=Get-ChildItem 'release/v5.2.7-installer' -Filter '*.exe' | Select-Object -First 1
          $p=Start-Process $installer.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Installer exited $($p.ExitCode)"}
      - name: Validate installed V5.2.7 and database preservation
        run: |
          $ErrorActionPreference='Stop'
          $install=Join-Path $env:LOCALAPPDATA 'Programs\KOMI Report V5';$runtime=Join-Path $install 'runtime\python.exe';$app=Join-Path $install 'source\app.py';$vf=Join-Path $install 'source\komi_version.py'
          if(-not(Test-Path $runtime) -or -not(Test-Path $app)){throw "Installed payload missing: $install"}
          if((Get-Content $vf -Raw) -notmatch '5\.2\.7'){throw 'Installed version is not 5.2.7.'}
          $env:KOMI_DB_PATH=Join-Path $env:RUNNER_TEMP 'komi-v527-smoke.db';Remove-Item $env:KOMI_DB_PATH -Force -ErrorAction SilentlyContinue
          & $runtime $app --smoke-test
          if($LASTEXITCODE -ne 0){throw 'Installed application smoke test failed.'}
          Remove-Item Env:KOMI_DB_PATH -ErrorAction SilentlyContinue
          $s=Get-Content (Join-Path $env:RUNNER_TEMP 'komi-preinstall-state.json') -Raw|ConvertFrom-Json
          if($s.db_exists){if(-not(Test-Path ([string]$s.db_path))){throw 'Database disappeared.'};$after=(Get-FileHash -Algorithm SHA256 ([string]$s.db_path)).Hash.ToLowerInvariant();if($after -ne [string]$s.db_sha256){throw 'Database changed during installer upgrade.'}}
          Write-Host 'RUNNER_INSTALL_V527_PASS'
      - name: Upload V5.2.7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: KOMI-Report-V5.2.7-Windows-x64-${{ github.sha }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            release/v5.2.7-installer/*.exe
            release/v5.2.7-installer/INSTALLER.sha256
            release/v5.2.7-installer/RELEASE_INFO.json
            release/v5.2.7-native/NATIVE_PAYLOAD_BUILD.json
