name: Prepare V5.2.7 metadata

on:
  push:
    branches: [release/v5.2.7]
    paths: ['.github/workflows/prepare-v527.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Bootstrap MinGit
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\actions-runner\_komi_tools\mingit'; $git=Join-Path $root 'cmd\git.exe'
          if (-not (Test-Path $git)) { throw 'Persistent MinGit is missing; run Native Windows workflow once first.' }
          (Join-Path $root 'cmd') | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          & $git --version
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/v5.2.7
      - name: Bump version authorities to 5.2.7
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'source/komi_version.py','source/pyproject.toml','source/uv.lock','source/app.spec',
            'web/package.json','web/package-lock.json','packaging/windows/KOMI_Report_V5.iss',
            'docs/RELEASE_SUPPORT_AND_RECOVERY.md','docs/CUSTOMER_RELEASE_NOTES.md',
            'docs/PILOT_RELEASE_CHECKLIST.md','docs/RELEASE_RUNBOOK.md',
            'docs/CUSTOMER_INSTALL_GUIDE.md','docs/CUSTOMER_GUIDE_V5_2.md'
          )
          foreach($f in $files){
            if(-not(Test-Path $f)){throw "Missing version authority: $f"}
            $t=[IO.File]::ReadAllText((Resolve-Path $f))
            $t=$t.Replace('5.2.6','5.2.7').Replace('5_2_6','5_2_7').Replace('50206','50207')
            [IO.File]::WriteAllText((Resolve-Path $f),$t,(New-Object Text.UTF8Encoding($false)))
          }
          git diff --check
          git diff --stat
      - name: Verify version gate
        run: |
          $ErrorActionPreference='Stop'
          $py='C:\actions-runner\_komi_tools\python-3.14.7\python.exe'
          if(-not(Test-Path $py)){throw 'Python 3.14.7 runtime missing.'}
          & $py source/tools/version_gate.py
          if($LASTEXITCODE -ne 0){throw 'V5.2.7 version gate failed.'}
      - name: Commit V5.2.7 metadata
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/komi_version.py source/pyproject.toml source/uv.lock source/app.spec web/package.json web/package-lock.json packaging/windows/KOMI_Report_V5.iss docs/RELEASE_SUPPORT_AND_RECOVERY.md docs/CUSTOMER_RELEASE_NOTES.md docs/PILOT_RELEASE_CHECKLIST.md docs/RELEASE_RUNBOOK.md docs/CUSTOMER_INSTALL_GUIDE_V5_2.md docs/CUSTOMER_INSTALL_GUIDE.md docs/CUSTOMER_GUIDE_V5_2.md
          git commit -m 'release: bump KOMI Report to V5.2.7'
          git push origin HEAD:release/v5.2.7
