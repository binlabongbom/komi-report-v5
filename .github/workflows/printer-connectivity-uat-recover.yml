name: Recover Printer Connectivity UAT Evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/printer-connectivity-uat-recover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Recover UTF-8 diagnostic evidence
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONUTF8 = '1'
          $env:PYTHONIOENCODING = 'utf-8'
          $runtime = Join-Path $env:LOCALAPPDATA 'Programs\KOMI Report V5\runtime\python.exe'
          if (-not (Test-Path $runtime)) { throw "Installed Python runtime not found: $runtime" }
          $source = Join-Path $env:GITHUB_WORKSPACE 'diagnostics\printer-connectivity-uat.json'
          if (-not (Test-Path $source)) { throw "Previous UAT evidence not found: $source" }
          $destination = Join-Path $env:GITHUB_WORKSPACE 'recovered-diagnostics\printer-connectivity-uat.json'
          New-Item -ItemType Directory -Path (Split-Path $destination) -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination $destination -Force
          & $runtime -c "import json,pathlib; p=pathlib.Path(r'$destination'); d=json.loads(p.read_text(encoding='utf-8')); print(json.dumps(d,ensure_ascii=True,indent=2,default=str))"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read recovered diagnostic evidence.' }

      - name: Upload recovered evidence
        uses: actions/upload-artifact@v4
        with:
          name: recovered-printer-connectivity-uat-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: recovered-diagnostics/printer-connectivity-uat.json
