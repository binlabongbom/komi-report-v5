name: Publish V5.2.6 Release

on:
  # Historical release publishing requires an explicit operator request.
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-v526:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download validated Windows installer artifact
        uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33747619161
          name: KOMI-Report-V5.2.6-Windows-x64-83dc5e32ab13b6a95aea48fab397e1f32c379231
          path: release-assets

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -printf '%p %s bytes\n'
          installer="$(find release-assets -type f -iname '*.exe' | head -n 1)"
          checksum="$(find release-assets -type f -name 'INSTALLER.sha256' | head -n 1)"
          release_info="$(find release-assets -type f -name 'RELEASE_INFO.json' | head -n 1)"
          test -n "$installer" && test -f "$installer"
          test -n "$checksum" && test -f "$checksum"
          test -n "$release_info" && test -f "$release_info"
          echo "installer=$installer" >> "$GITHUB_ENV"
          echo "checksum=$checksum" >> "$GITHUB_ENV"
          echo "release_info=$release_info" >> "$GITHUB_ENV"

      - name: Publish GitHub Release v5.2.6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes=$(cat <<'EOF'
          KOMI Report V5.2.6

          Release focus:
          - Faster perceived startup and tab navigation without changing the user experience.
          - Bundled Windows x64 runtime migrated to CPython 3.14.7.
          - Native Windows x64 validation completed on self-hosted runner.
          - V5.2.6 version gate and performance contract passed.
          - Bundled runtime smoke test passed for PyQt6, NumPy, cryptography and pydantic-core.
          - Next.js production build and Inno Setup installer compilation passed.

          Build source: main @ 83dc5e32ab13b6a95aea48fab397e1f32c379231
          Target: Windows x64
          EOF
          )

          if gh release view v5.2.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v5.2.6 --repo "$GITHUB_REPOSITORY" --title "KOMI Report V5.2.6" --notes "$notes" --latest
          else
            gh release create v5.2.6 --repo "$GITHUB_REPOSITORY" --target 83dc5e32ab13b6a95aea48fab397e1f32c379231 --title "KOMI Report V5.2.6" --notes "$notes" --latest
          fi

          gh release upload v5.2.6 "$installer" "$checksum" "$release_info" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v5.2.6 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,url,assets
