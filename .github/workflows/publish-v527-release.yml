name: Publish V5.2.7 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v527-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  self-sign-v527:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Checkout release security tooling
        uses: actions/checkout@v4

      - name: Download validated Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33853353266
          name: KOMI-Report-V5.2.7-Windows-x64-1888e8b3be1ad3fdb595a3ca4e155d4168f4a976
          path: release-assets

      - name: Verify original validated build
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem release-assets -Filter *.exe -Recurse | Select-Object -First 1
          $checksum = Get-ChildItem release-assets -Filter INSTALLER.sha256 -Recurse | Select-Object -First 1
          $releaseInfo = Get-ChildItem release-assets -Filter RELEASE_INFO.json -Recurse | Select-Object -First 1

          if (-not $installer) { throw 'Validated installer artifact was not found.' }
          if (-not $checksum) { throw 'INSTALLER.sha256 was not found.' }
          if (-not $releaseInfo) { throw 'RELEASE_INFO.json was not found.' }

          $expected = ((Get-Content -LiteralPath $checksum.FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Original artifact SHA-256 mismatch. Expected $expected, got $actual."
          }

          $info = Get-Content -LiteralPath $releaseInfo.FullName -Raw | ConvertFrom-Json
          if ([string]$info.version -ne '5.2.7') { throw "Unexpected version: $($info.version)" }
          if ([string]$info.python_runtime -ne '3.14.7') { throw "Unexpected Python runtime: $($info.python_runtime)" }
          if ([string]$info.target -ne 'Windows x64') { throw "Unexpected target: $($info.target)" }
          if ([string]$info.installer_sha256 -and ([string]$info.installer_sha256).ToLowerInvariant() -ne $actual) {
            throw 'RELEASE_INFO.json installer SHA-256 does not match the validated installer.'
          }

          "installer=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "release_info=$($releaseInfo.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Validated original SHA-256: $actual"

      - name: Self-sign installer with persistent free certificate
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $PWD 'release-signed'
          & .\packaging\windows\Sign-KomiSelfSigned.ps1 `
            -InstallerPath $env:installer `
            -ReleaseInfoPath $env:release_info `
            -OutputDirectory $output
          if ($LASTEXITCODE -ne 0) { throw 'Self-signing script failed.' }
          Copy-Item -LiteralPath LICENSE -Destination (Join-Path $output 'LICENSE') -Force

      - name: Windows Defender scan when available
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $PWD 'release-signed\DEFENDER_SCAN.txt'
          $installer = Get-ChildItem release-signed -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'Signed installer was not found for Defender scan.' }

          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("file=$($installer.Name)")
          $lines.Add("sha256=$((Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant())")
          $lines.Add("scan_time_utc=$([DateTime]::UtcNow.ToString('o'))")

          try {
            $mpStatusCommand = Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue
            $mpScanCommand = Get-Command Start-MpScan -ErrorAction SilentlyContinue
            if (-not $mpStatusCommand -or -not $mpScanCommand) {
              $lines.Add('defender_scan=unavailable')
              $lines.Add('reason=Microsoft Defender PowerShell cmdlets are unavailable on this runner.')
            }
            else {
              $status = Get-MpComputerStatus
              $lines.Add("antivirus_enabled=$($status.AntivirusEnabled)")
              $lines.Add("real_time_protection_enabled=$($status.RealTimeProtectionEnabled)")
              Start-MpScan -ScanType CustomScan -ScanPath $installer.FullName
              $lines.Add('defender_scan=completed')
            }
          }
          catch {
            $lines.Add('defender_scan=unavailable_or_failed')
            $lines.Add("reason=$($_.Exception.Message.Replace([Environment]::NewLine, ' '))")
            Write-Warning "Defender scan could not be completed: $($_.Exception.Message)"
          }

          $lines | Set-Content -LiteralPath $report -Encoding ascii
          Get-Content -LiteralPath $report

      - name: Verify signed release package on Windows
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem release-signed -Filter *.exe | Select-Object -First 1
          $signatureInfo = Get-Content release-signed\SIGNATURE_INFO.json -Raw | ConvertFrom-Json
          $releaseInfo = Get-Content release-signed\RELEASE_INFO.json -Raw | ConvertFrom-Json
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          $actualSha = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($actualSha -ne ([string]$signatureInfo.installer_sha256).ToLowerInvariant()) {
            throw 'Signed installer SHA-256 does not match SIGNATURE_INFO.json.'
          }
          if ($actualSha -ne ([string]$releaseInfo.installer_sha256).ToLowerInvariant()) {
            throw 'Signed installer SHA-256 does not match RELEASE_INFO.json.'
          }
          if (-not $signature.SignerCertificate) { throw 'Installer is not Authenticode signed.' }
          if ($signature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne ([string]$signatureInfo.certificate_thumbprint_sha1).ToUpperInvariant()) {
            throw 'Authenticode signer thumbprint mismatch.'
          }
          if ($signature.Status -in @('HashMismatch', 'NotSigned')) {
            throw "Authenticode verification failed: $($signature.Status)"
          }

          & .\release-signed\VERIFY-INTEGRITY.ps1 -Installer $installer.FullName
          & .\release-signed\VERIFY-SIGNATURE.ps1 -Installer $installer.FullName
          Write-Host "Signed installer SHA-256: $actualSha"
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"
          Write-Host "Thumbprint: $($signature.SignerCertificate.Thumbprint)"
          Write-Host "Authenticode status: $($signature.Status)"

      - name: Upload self-signed hardened release artifact
        uses: actions/upload-artifact@v4
        with:
          name: KOMI-Report-V5.2.7-Free-Signed
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
          path: release-signed/*

  publish-v527:
    needs: self-sign-v527
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download self-signed hardened release artifact
        uses: actions/download-artifact@v4
        with:
          name: KOMI-Report-V5.2.7-Free-Signed
          path: release-assets

      - name: Verify release assets before publication
        shell: bash
        run: |
          set -euo pipefail
          installer="$(find release-assets -maxdepth 1 -type f -iname '*.exe' | head -n 1)"
          test -n "$installer" && test -f "$installer"
          test -f release-assets/INSTALLER.sha256
          test -f release-assets/SHA256SUMS.txt
          test -f release-assets/CERTIFICATE.sha256
          test -f release-assets/KOMI-Report-Code-Signing.cer
          test -f release-assets/SIGNATURE_INFO.json
          test -f release-assets/RELEASE_INFO.json
          test -f release-assets/VERIFY-INTEGRITY.ps1
          test -f release-assets/VERIFY-SIGNATURE.ps1
          test -f release-assets/TRUST-KOMI-CERT.ps1
          test -f release-assets/LICENSE

          (cd release-assets && sha256sum -c INSTALLER.sha256)
          (cd release-assets && sha256sum -c CERTIFICATE.sha256)

          python3 - <<'PY'
          import json
          from pathlib import Path

          sig = json.loads(Path('release-assets/SIGNATURE_INFO.json').read_text(encoding='utf-8-sig'))
          rel = json.loads(Path('release-assets/RELEASE_INFO.json').read_text(encoding='utf-8-sig'))
          assert sig['signing_mode'] == 'self-signed Authenticode', sig
          assert sig['public_trust'] is False, sig
          assert rel['version'] == '5.2.7', rel
          assert rel['signing_mode'] == 'self-signed Authenticode', rel
          assert rel['installer_sha256'].lower() == sig['installer_sha256'].lower(), (rel, sig)
          print(json.dumps(sig, indent=2))
          PY

          installer_sha256="$(python3 -c "import json; print(json.load(open('release-assets/SIGNATURE_INFO.json', encoding='utf-8-sig'))['installer_sha256'])")"
          cert_thumbprint="$(python3 -c "import json; print(json.load(open('release-assets/SIGNATURE_INFO.json', encoding='utf-8-sig'))['certificate_thumbprint_sha1'])")"
          cert_sha256="$(python3 -c "import json; print(json.load(open('release-assets/SIGNATURE_INFO.json', encoding='utf-8-sig'))['certificate_file_sha256'])")"
          timestamp_used="$(python3 -c "import json; print(str(json.load(open('release-assets/SIGNATURE_INFO.json', encoding='utf-8-sig'))['timestamp_used']).lower())")"
          signer_subject="$(python3 -c "import json; print(json.load(open('release-assets/SIGNATURE_INFO.json', encoding='utf-8-sig'))['publisher_subject'])")"

          echo "installer_sha256=$installer_sha256" >> "$GITHUB_ENV"
          echo "cert_thumbprint=$cert_thumbprint" >> "$GITHUB_ENV"
          echo "cert_sha256=$cert_sha256" >> "$GITHUB_ENV"
          echo "timestamp_used=$timestamp_used" >> "$GITHUB_ENV"
          echo "signer_subject=$signer_subject" >> "$GITHUB_ENV"

      - name: Publish GitHub Release v5.2.7
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes=$(cat <<EOF
          KOMI Report V5.2.7

          Hotfix focus:
          - Fix user-name enrichment on successful public Web Connection meter reads.
          - Prevent numeric subject IDs such as 1, 2, 3 from leaking into User/report history when RAM Meter Export provides the real user name.
          - Added targeted regression coverage for public meter reads and cached user-name mappings.
          - Version gate passed for V5.2.7.
          - Native Windows x64 payload build, silent upgrade, and installed smoke validation passed on the self-hosted runner.

          Security & integrity — free baseline:
          - Windows installer is Authenticode self-signed with SHA-256.
          - Signer: $signer_subject
          - Signing certificate thumbprint: $cert_thumbprint
          - Public certificate SHA-256: $cert_sha256
          - Signed installer SHA-256: $installer_sha256
          - External timestamp used: $timestamp_used
          - INSTALLER.sha256, SHA256SUMS.txt, CERTIFICATE.sha256, SIGNATURE_INFO.json and RELEASE_INFO.json are included.
          - VERIFY-INTEGRITY.ps1 verifies the installer hash.
          - VERIFY-SIGNATURE.ps1 verifies both the installer hash and signer thumbprint.
          - TRUST-KOMI-CERT.ps1 is an optional explicit helper for managed machines that choose to trust this self-signed certificate.
          - The private signing key remains only in the self-hosted Windows runner certificate store and is not published.
          - GitHub also records a SHA-256 digest for uploaded release assets.

          Important:
          - This is a SELF-SIGNED certificate, not a publicly trusted commercial code-signing certificate.
          - A clean Windows machine may still show Unknown Publisher, NotTrusted, or SmartScreen warnings until the certificate is explicitly trusted.

          License:
          - Free to use under the KOMI Report proprietary license.
          - Modification, reverse engineering, resale, and unauthorized redistribution are prohibited.

          Validated build source: release/v5.2.7 @ 1888e8b3be1ad3fdb595a3ca4e155d4168f4a976
          Validation run: 33853353266
          Target: Windows x64
          EOF
          )

          if gh release view v5.2.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v5.2.7 --repo "$GITHUB_REPOSITORY" --title "KOMI Report V5.2.7" --notes "$notes" --latest
          else
            gh release create v5.2.7 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "KOMI Report V5.2.7" --notes "$notes" --latest
          fi

          gh release upload v5.2.7 release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v5.2.7 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,url,assets
