name: Python 3.14 Runtime Migration

on:
  push:
    branches: [chatgpt/python-3-14-runtime]
    paths:
      - '.github/workflows/python-314-runtime-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-python-runtime:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Bootstrap portable Git
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy Bypass -Force
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          if (-not $git) {
            $portableRoot = Join-Path $env:RUNNER_TEMP 'mingit'
            if (-not (Test-Path (Join-Path $portableRoot 'cmd\git.exe'))) {
              Remove-Item $portableRoot -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Path $portableRoot -Force | Out-Null
              $release = Invoke-RestMethod -Headers @{ 'User-Agent' = 'KOMI-Report-native-runner' } -Uri 'https://api.github.com/repos/git-for-windows/git/releases/latest'
              $asset = $release.assets | Where-Object { $_.name -match '^MinGit-.*-64-bit\.zip$' } | Select-Object -First 1
              if (-not $asset) { throw 'Unable to locate a 64-bit MinGit asset.' }
              $zip = Join-Path $env:RUNNER_TEMP $asset.name
              Invoke-WebRequest -UseBasicParsing -Uri $asset.browser_download_url -OutFile $zip
              Expand-Archive -LiteralPath $zip -DestinationPath $portableRoot -Force
            }
            (Join-Path $portableRoot 'cmd') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - uses: actions/checkout@v4
        with:
          ref: chatgpt/python-3-14-runtime
          fetch-depth: 0
          persist-credentials: true

      - name: Bootstrap CPython 3.14.7 migration toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $pythonRoot = Join-Path $env:RUNNER_TEMP 'komi-python-embed-3.14.7'
          $pythonExe = Join-Path $pythonRoot 'python.exe'
          if (-not (Test-Path $pythonExe)) {
            Remove-Item $pythonRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $pythonRoot -Force | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP 'python-3.14.7-embed-amd64.zip'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.14.7/python-3.14.7-embed-amd64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $pythonRoot -Force
            $pth = Join-Path $pythonRoot 'python314._pth'
            if (-not (Test-Path $pth)) { throw 'Python 3.14.7 embeddable runtime is missing python314._pth.' }
            $pthText = Get-Content $pth -Raw
            $pthText = $pthText -replace '#import site', 'import site'
            Set-Content -LiteralPath $pth -Value $pthText -Encoding ascii
            $getPip = Join-Path $env:RUNNER_TEMP 'get-pip.py'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getPip
            & $pythonExe $getPip --disable-pip-version-check
            if ($LASTEXITCODE -ne 0) { throw 'get-pip failed for Python 3.14.7.' }
          }
          $pythonRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $pythonRoot 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $pythonExe --version
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.14.7 failed to start.' }
          & $pythonExe -m pip install --disable-pip-version-check uv pytest
          if ($LASTEXITCODE -ne 0) { throw 'Migration tooling install failed.' }

      - name: Migrate Windows bundled runtime source to CPython 3.14.7
        run: |
          $ErrorActionPreference = 'Stop'
          $kitPath = 'source/tools/package_windows_test_kit.py'
          $kit = Get-Content $kitPath -Raw
          $replacements = [ordered]@{
            'official CPython 3.11 embeddable runtime' = 'official CPython 3.14.7 embeddable runtime'
            'PYTHON_VERSION = "3.11.9"' = 'PYTHON_VERSION = "3.14.7"'
            '"3.11"' = '"3.14"'
            '"cp311"' = '"cp314"'
            'python311._pth' = 'python314._pth'
            'python311.zip' = 'python314.zip'
            'Windows CPython 3.11 wheels' = 'Windows CPython 3.14 wheels'
          }
          foreach ($pair in $replacements.GetEnumerator()) {
            $kit = $kit.Replace($pair.Key, $pair.Value)
          }
          Set-Content -LiteralPath $kitPath -Value $kit -Encoding utf8

          $builderPath = 'source/tools/build_windows_rc.py'
          $builder = Get-Content $builderPath -Raw
          $builderReplacements = [ordered]@{
            'bundled CPython 3.11 x64' = 'bundled CPython 3.14.7 x64'
            'python311._pth' = 'python314._pth'
            'python311.zip' = 'python314.zip'
          }
          foreach ($pair in $builderReplacements.GetEnumerator()) {
            $builder = $builder.Replace($pair.Key, $pair.Value)
          }
          Set-Content -LiteralPath $builderPath -Value $builder -Encoding utf8

      - name: Regenerate Windows x64 dependency lock for Python 3.14
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location source
          uv pip compile requirements.txt --python-platform x86_64-pc-windows-msvc --python-version 3.14 --generate-hashes --only-binary=:all: --output-file requirements-windows-x64.lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.14 Windows dependency resolution failed.' }
          Pop-Location

      - name: Validate CPython 3.14 Windows wheels
        run: |
          $ErrorActionPreference = 'Stop'
          $wheelhouse = Join-Path $env:RUNNER_TEMP 'komi-cp314-wheelhouse'
          Remove-Item $wheelhouse -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $wheelhouse -Force | Out-Null
          python -m pip download --dest $wheelhouse --only-binary=:all: --platform win_amd64 --implementation cp --python-version 3.14 --abi cp314 --require-hashes -r source/requirements-windows-x64.lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'One or more KOMI dependencies do not have a validated Windows cp314 wheel.' }
          $count = (Get-ChildItem $wheelhouse -Filter *.whl).Count
          Write-Host "CP314WheelCount=$count"
          if ($count -lt 1) { throw 'No cp314 wheel payload was downloaded.' }

      - name: Validate migrated runtime code
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = (Resolve-Path 'source').Path
          python -m py_compile source/tools/package_windows_test_kit.py source/tools/build_windows_rc.py
          if ($LASTEXITCODE -ne 0) { throw 'Migrated packaging code does not compile.' }
          python -m pytest -q source/tests/test_v526_performance_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'V5.2.6 performance contract regressed.' }
          Select-String -Path source/tools/package_windows_test_kit.py,source/tools/build_windows_rc.py -Pattern '3\.11|cp311|python311' | ForEach-Object { Write-Host $_.Line }
          if (Select-String -Path source/tools/package_windows_test_kit.py,source/tools/build_windows_rc.py -Pattern '3\.11|cp311|python311' -Quiet) {
            throw 'Legacy CPython 3.11 runtime references remain in active Windows packaging code.'
          }

      - name: Commit Python 3.14 runtime migration
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/tools/package_windows_test_kit.py source/tools/build_windows_rc.py source/requirements-windows-x64.lock.txt
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Generated migration diff failed git diff --check.' }
          if (git diff --cached --quiet) {
            Write-Host 'No runtime migration changes to commit.'
            exit 0
          }
          git commit -m 'build: migrate bundled Windows runtime to Python 3.14.7'
          if ($LASTEXITCODE -ne 0) { throw 'Migration commit failed.' }
          git push origin HEAD:chatgpt/python-3-14-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Migration push failed.' }
