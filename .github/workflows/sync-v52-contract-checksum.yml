name: Sync V5.2 Contract Checksum

on:
  push:
    branches: [chatgpt/python-3-14-runtime]
    paths:
      - '.github/workflows/sync-v52-contract-checksum.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-contract-checksum:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Bootstrap portable Git
        run: |
          $ErrorActionPreference = 'Stop'
          $portableRoot = Join-Path $env:RUNNER_TEMP 'mingit'
          $gitPath = Join-Path $portableRoot 'cmd\git.exe'
          if (-not (Test-Path $gitPath)) {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            New-Item -ItemType Directory -Path $portableRoot -Force | Out-Null
            $release = Invoke-RestMethod -Headers @{ 'User-Agent' = 'KOMI-Report-native-runner' } -Uri 'https://api.github.com/repos/git-for-windows/git/releases/latest'
            $asset = $release.assets | Where-Object { $_.name -match '^MinGit-.*-64-bit\.zip$' } | Select-Object -First 1
            if (-not $asset) { throw 'Unable to locate a 64-bit MinGit asset.' }
            $zip = Join-Path $env:RUNNER_TEMP $asset.name
            Invoke-WebRequest -UseBasicParsing -Uri $asset.browser_download_url -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $portableRoot -Force
          }
          (Join-Path $portableRoot 'cmd') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: actions/checkout@v7
        with:
          ref: chatgpt/python-3-14-runtime
          fetch-depth: 0
          persist-credentials: true

      - name: Bootstrap CPython 3.14.7 for validation
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $pythonRoot = Join-Path $env:RUNNER_TEMP 'komi-checksum-python-3.14.7'
          $pythonExe = Join-Path $pythonRoot 'python.exe'
          if (-not (Test-Path $pythonExe)) {
            Remove-Item $pythonRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $pythonRoot -Force | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP 'python-3.14.7-embed-amd64.zip'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.14.7/python-3.14.7-embed-amd64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $pythonRoot -Force
          }
          & $pythonExe --version
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.14.7 validation runtime failed to start.' }
          "KOMI_CHECKSUM_PYTHON=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Synchronize checksum authority
        run: |
          $ErrorActionPreference = 'Stop'
          $contract = 'docs/V5_2_HOST_API_IMPLEMENTATION_REQUEST.md'
          $metadata = 'source/services/v5_2_contract_metadata.py'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $contract).Hash.ToLowerInvariant()
          $text = Get-Content -LiteralPath $metadata -Raw
          $text = [regex]::Replace($text, 'CONTRACT_SHA256 = "[0-9a-f]{64}"', "CONTRACT_SHA256 = `"$actual`"")
          $text = $text.TrimEnd("`r", "`n") + "`n"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Resolve-Path $metadata), $text, $utf8NoBom)
          Write-Host "ContractSHA256=$actual"

      - name: Validate version gate
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:KOMI_CHECKSUM_PYTHON)) { throw 'Python 3.14.7 validation runtime is missing.' }
          & $env:KOMI_CHECKSUM_PYTHON source/tools/version_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'V5.2 version gate still fails after checksum synchronization.' }

      - name: Commit checksum synchronization
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/services/v5_2_contract_metadata.py
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Checksum diff failed git diff --check.' }
          if (git diff --cached --quiet) {
            Write-Host 'Contract checksum already synchronized.'
            exit 0
          }
          git commit -m 'fix: synchronize V5.2 shared contract checksum'
          if ($LASTEXITCODE -ne 0) { throw 'Checksum commit failed.' }
          git push origin HEAD:chatgpt/python-3-14-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Checksum push failed.' }
