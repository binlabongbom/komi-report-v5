name: Temporary V5.2.8 Metadata Bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-v528-hotfix-patcher.yml

permissions:
  contents: write

jobs:
  bump-v528:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout hotfix
        uses: actions/checkout@v4
        with:
          ref: hotfix/v5.2.8-customer-user-and-nav
          fetch-depth: 0

      - name: Bump metadata
        shell: powershell
        run: python tools/bump_v528.py

      - name: Run version gate
        shell: powershell
        run: |
          python source/tools/version_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'V5.2.8 version gate failed' }

      - name: Commit V5.2.8 metadata
        shell: powershell
        run: |
          git config user.name 'KOMI Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs packaging source/app.spec source/komi_version.py source/pyproject.toml source/uv.lock web/package.json web/package-lock.json
          if (-not (git status --porcelain)) { throw 'No V5.2.8 metadata changes were produced' }
          git commit -m 'release: bump KOMI Report to V5.2.8'
          git push origin HEAD:hotfix/v5.2.8-customer-user-and-nav
