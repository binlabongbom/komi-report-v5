name: Unblock Free Security Rollout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unblock-free-security-rollout.yml'

permissions:
  actions: write
  contents: read

jobs:
  unblock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel superseded or stalled self-hosted runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run cancel 33893983244 --repo "$GITHUB_REPOSITORY" || true
          gh run cancel 33894330118 --repo "$GITHUB_REPOSITORY" || true
          echo "Cancelled stalled audit and superseded rebuild run; corrected rebuild run 33894531010 remains queued."
