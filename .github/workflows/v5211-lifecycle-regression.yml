name: V5.2.11 lifecycle and offline-license regression
on:
  push:
    branches: [fix/v5.2.11-registration-errors]
    paths: [.github/workflows/v5211-lifecycle-regression.yml]
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: d99a0de57e3f10010d8bc4dd3c836dc31d12b510
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r source/requirements-windows-x64.lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed' }
          python -m pip install --disable-pip-version-check pytest==9.1.1 httpx2==2.13.1
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency installation failed' }
      - name: Run local-only lifecycle, outbox, contract and offline-license tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'source'
          $env:KOMI_PEER_SYNC_STATE_FILE = Join-Path $env:RUNNER_TEMP 'v5211-lifecycle-peer.json'
          python -m pytest -q source/tests/test_v5_2_runtime.py source/tests/test_v5_2_outbox.py source/tests/test_v5_2_contract.py source/tests/test_v5_2_legacy_transport_gate.py source/tests/test_v5_2_local_contract_e2e.py source/tests/test_offline_license_v52.py --junitxml=lifecycle-evidence.xml
          if ($LASTEXITCODE -ne 0) { throw 'Lifecycle regression failed' }
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: KOMI-v5.2.11-lifecycle-regression
          retention-days: 14
          if-no-files-found: warn
          path: lifecycle-evidence.xml
