name: V5.2.6 Performance Patch
on:
  push:
    branches: [chatgpt/v5-2-6-performance]
permissions:
  contents: write
jobs:
  align-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v5-2-6-performance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/align_v526_version.py
      - shell: pwsh
        run: |
          python source/tools/version_gate.py
          python -m pip install pytest
          python -m pytest -q source/tests/test_v526_performance_contract.py
      - shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/pyproject.toml web/package.json web/package-lock.json source/app.spec source/uv.lock packaging/windows/KOMI_Report_V5.iss docs/RELEASE_SUPPORT_AND_RECOVERY.md docs/CUSTOMER_RELEASE_NOTES.md docs/PILOT_RELEASE_CHECKLIST.md docs/RELEASE_RUNBOOK.md docs/CUSTOMER_INSTALL_GUIDE.md docs/CUSTOMER_GUIDE_V5_2.md
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: align V5.2.6 release authorities"
            git push origin HEAD:chatgpt/v5-2-6-performance
          }
