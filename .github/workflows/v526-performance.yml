name: V5.2.6 Performance Patch
on: [push]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v5-2-6-performance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fix_v526_app_spec.py
      - shell: pwsh
        run: |
          python source/tools/version_gate.py
          python -m pip install pytest
          python -m pytest -q source/tests/test_v526_performance_contract.py
      - shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/app.spec
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: preserve app.spec formatting in V5.2.6"
            git push origin HEAD:chatgpt/v5-2-6-performance
          }
