[project]
name = "komi-report-v5"
version = "5.2.9"
description = "Desktop-first KOMI Report with file import and live read-only bizhub Meter collection"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=50,<51",
  "PyQt6~=6.11.0",
  "PyQt6-Charts~=6.11.0",
  "fastapi>=0.115,<1",
  "keyring>=25,<26",
  "openpyxl~=3.1.0",
  "pyqtgraph~=0.13.3",
  "pysnmp>=7.1,<8",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.10,<7"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
]
