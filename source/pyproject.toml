[project]
name = "komi-report-v5"
version = "5.2.12"
description = "Desktop-first KOMI Report with file import and live read-only bizhub Meter collection"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=50.0.1,<51",
  "PyQt6~=6.11.0",
  "PyQt6-Charts~=6.11.0",
  "PyQt6-Qt6==6.11.2",
  "PyQt6-Charts-Qt6==6.11.2",
  "fastapi>=0.141.1,<1",
  "keyring>=25.7,<26",
  "truststore==0.10.4",
  "openpyxl~=3.1.5",
  "pyqtgraph~=0.14.0",
  "pysnmp>=7.1.29,<8",
  "uvicorn>=0.53,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10", "ruff==0.16.10", "pyinstaller==6.22.3", "uv==0.12.24", "pip-audit==2.10.1"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.13.1,<3",
]
